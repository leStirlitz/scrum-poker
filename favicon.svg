<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Purple background tile -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="5" fill="url(#bg)"/>

  <!-- Playing card -->
  <rect x="5" y="3" width="22" height="26" rx="3" fill="white" stroke="#e2e8f0" stroke-width="0.5"/>

  <!-- Spade ♠ centred on card -->
  <text x="16" y="21"
        font-family="Georgia, serif"
        font-size="17"
        font-weight="bold"
        text-anchor="middle"
        fill="#4f46e5">♠</text>

  <!-- Small "?" top-left corner of card -->
  <text x="8.5" y="11"
        font-family="Arial, sans-serif"
        font-size="7"
        font-weight="bold"
        text-anchor="middle"
        fill="#4f46e5">?</text>
</svg>
